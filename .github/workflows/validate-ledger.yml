name: Validate research ledger

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "calculator.html"
      - "assets/site.js"
      - ".github/workflows/validate-ledger.yml"
  pull_request:
  workflow_dispatch:

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check findings, sources, empty CPA seats, calculator anchors, and page/JSON match
        run: python3 scripts/validate_ledger.py
