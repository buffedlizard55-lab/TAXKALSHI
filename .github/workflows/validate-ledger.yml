name: Validate research ledger

on:
  push:
    paths:
      - "data/**"
      - "scripts/validate_ledger.py"
      - ".github/workflows/validate-ledger.yml"
  pull_request:
  workflow_dispatch:

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check findings, sources, and empty CPA seats
        run: python3 scripts/validate_ledger.py
